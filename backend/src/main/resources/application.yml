spring:
  application:
    name: campus-activity-management
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:campus_app}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

campus:
  admin:
    username: ${CAMPUS_ADMIN_USERNAME:}
    password: ${CAMPUS_ADMIN_PASSWORD:}
